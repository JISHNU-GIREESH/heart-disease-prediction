{% extends 'index.html' %}
{% load static %}
{% block body %}
{% if error == "create" %}
<script>
    alert('Registration Successful');
    window.location="{% url 'login' %}";
</script>
{% endif %}

<style>
    :root {
        --primary-color: #2ca4b6;
        --secondary-color: #605d5d;
        --accent-color: #61bbb9;
        --glass-bg: rgba(255, 255, 255, 0.9);
        --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    }

    .register-section {
        min-height: 90vh;
        background: linear-gradient(135deg, #e0f2f1 0%, #ffffff 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
    }

    .register-card {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        border-radius: 25px;
        box-shadow: var(--glass-shadow);
        width: 100%;
        max-width: 800px;
        padding: 45px;
        border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .register-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .register-header h3 {
        color: var(--secondary-color);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .register-header .underline {
        height: 5px;
        width: 80px;
        background: var(--primary-color);
        margin: 10px auto;
        border-radius: 3px;
    }

    .form-label {
        font-weight: 600;
        color: #555;
        margin-bottom: 8px;
        display: block;
    }

    .form-control {
        border-radius: 12px;
        border: 1.5px solid #eee;
        padding: 12px 18px;
        font-size: 0.95rem;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 4px rgba(44, 164, 182, 0.15);
        outline: none;
    }

    .btn-register {
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 15px 30px;
        font-weight: 700;
        width: 100%;
        margin-top: 30px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .btn-register:hover {
        background: #248a99;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(44, 164, 182, 0.3);
    }

    .radio-group {
        display: flex;
        gap: 20px;
        padding: 10px 15px;
        background: #f9f9f9;
        border-radius: 12px;
        border: 1.5px solid #eee;
    }

    .radio-option {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }

    .radio-option input {
        cursor: pointer;
    }

    .footer-text {
        text-align: center;
        margin-top: 25px;
        color: #777;
        font-size: 0.9rem;
    }

    .footer-text a {
        color: var(--primary-color);
        font-weight: 600;
        text-decoration: none;
    }
</style>

<div class="register-section">
    <div class="register-card">
        <div class="register-header">
            <h3>Register Account</h3>
            <div class="underline"></div>
        </div>

        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" name="fname" placeholder="John" required>
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" name="lname" placeholder="Doe" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" name="uname" placeholder="johndoe123" required>
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="pwd" placeholder="••••••••" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" name="email" placeholder="john@example.com" required>
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label">Contact Number</label>
                    <input type="text" class="form-control" name="contact" placeholder="+1 234 567 890" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" name="dob" required>
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label">Profile Image</label>
                    <input type="file" class="form-control" name="image" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label">City / Address</label>
                    <input type="text" class="form-control" name="add" placeholder="New York, USA" required>
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label">I am a...</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="type" value="Patient" required> Patient
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="type" value="Doctor" required> Doctor
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-register">Create Account</button>
            
            <div class="footer-text">
                Already have an account? <a href="{% url 'login' %}">Login here</a><br>
                <small>By clicking Register, you agree to our terms and conditions.</small>
            </div>
        </form>
    </div>
</div>
{% endblock %}
