{% extends 'index.html' %}
{% load static %}
{% block body %}

{% if error == "pat" %}
<script>
    alert('Logged in successfully as Admin');
    window.location.href = "{% url 'admin_home' %}";
</script>
{% endif %}

{% if error == "not" %}
<script>
    alert('Invalid Admin Credentials');
</script>
{% endif %}

<style>
    :root {
        --admin-primary: #dc3545;
        --admin-dark: #343a40;
        --glass-bg: rgba(255, 255, 255, 0.9);
    }

    .admin-section {
        min-height: 80vh;
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .admin-card {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
        padding: 40px;
        border-top: 5px solid var(--admin-dark);
    }

    .admin-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .admin-header i {
        font-size: 3rem;
        color: var(--admin-dark);
        margin-bottom: 15px;
    }

    .admin-header h3 {
        font-weight: 800;
        color: var(--admin-dark);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .form-control {
        border-radius: 10px;
        padding: 12px;
        border: 1px solid #ddd;
    }

    .btn-admin {
        background: var(--admin-dark);
        color: white;
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 20px;
        transition: all 0.3s;
    }

    .btn-admin:hover {
        background: #000;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
</style>

<div class="admin-section">
    <div class="admin-card">
        <div class="admin-header">
            <i class="fa fa-user-shield"></i>
            <h3>Admin Portal</h3>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group mb-4">
                <label class="font-weight-bold">Admin Username</label>
                <input type="text" class="form-control" name="uname" placeholder="Admin username" required>
            </div>

            <div class="form-group mb-4">
                <label class="font-weight-bold">Password</label>
                <input type="password" class="form-control" name="pwd" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-admin">Secure Login</button>
        </form>
    </div>
</div>
{% endblock %}
